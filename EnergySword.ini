; Energy Sword settings. [Grip] changes apply live: save this file and press F10 in game.
;
; HOW TO GET IT
;   Craft it at any forge: 2 Refined Malachite + 2 Quicksilver Ingots + 1 Dwarven Metal Ingot.
;   Or console: help "Energy Sword" 0, then player.additem <id> 1
;
; One-handed. Every hit adds shock damage, and the blade crackles with lightning like a shock-enchanted weapon.

[Grip]
; The Halo sword is held by the bar between the blades. The model is already turned so you see the blade from the side;
; these numbers turn/slide it further.
AlignGrip = 1
Style = 1        ; 1 = grip from your finger bones (works in either hand, mirrored for the left). 0 = turn from where Skyrim puts it
ReloadKey = 68   ; F10: edit this file while Skyrim is running (alt-tab), save, press F10 to see the change
; Your tuned values are the defaults. The left hand uses the same numbers, mirrored automatically.
; Fine tuning if it sits a little off (Skyrim units, ~1.4 cm each):
GripX = 0        ; slide up/down the handle bar
GripY = 0        ; slide sideways
GripZ = 0        ; slide along the blades
Yaw = 180        ; degrees: swing the blades around the handle bar
Twist = 90       ; degrees: spin the sword around the blade direction
Tilt = 90        ; degrees: tip the blades up (+) or down (-)

; First person: lift your arms (and the sword) while it's drawn
Raise = 5        ; Skyrim units up (~7 cm). 0 = Skyrim's normal height
Forward = 0      ; push the arms forward (+) or back (-)

[Shock]
VanillaShockFX = 1   ; use vanilla's shock enchantment effect (gives the lightning visuals). 0 = plain shock damage
